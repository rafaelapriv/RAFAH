
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f00070">
  <title>Verificação de acesso</title>

  <style>
    :root {
      --pink: #ff1688;
      --hot: #f00070;
      --deep: #b9004f;
      --ink: #2a1721;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(255,255,255,.72), transparent 38%),
        radial-gradient(ellipse at 88% 82%, rgba(255,35,145,.38), transparent 35%),
        linear-gradient(145deg, #ffe8f3 0%, #ffadd4 42%, #ff69b2 100%);
    }

    .card {
      width: min(100%, 440px);
      padding: 34px 28px 30px;
      border: 1px solid rgba(255,255,255,.88);
      border-radius: 25px;
      background: rgba(255,255,255,.91);
      box-shadow: 0 22px 65px rgba(169,26,88,.16),
                  0 4px 14px rgba(169,26,88,.07);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .shield {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: white;
      font-size: 29px;
      background: linear-gradient(135deg, #ff5cac, #f00070);
      box-shadow: 0 8px 20px rgba(233,30,104,.22);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(25px, 6vw, 29px);
      letter-spacing: -.7px;
      line-height: 1.15;
    }

    .intro {
      margin: 0 auto 27px;
      max-width: 330px;
      color: #887680;
      font-size: 16px;
      line-height: 1.6;
    }

    .confirm {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px 16px;
      border: 1px solid #f0c7d9;
      border-radius: 15px;
      background: linear-gradient(110deg, #fff 0%, #fff5fa 100%);
      text-align: left;
      cursor: pointer;
    }

    .confirm:has(input:checked) {
      border-color: #ed4b91;
      box-shadow: 0 0 0 3px rgba(237,36,107,.09);
    }

    .confirm input {
      appearance: none;
      flex: 0 0 27px;
      width: 27px;
      height: 27px;
      margin: 0;
      border: 2px solid #c6aab7;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      position: relative;
    }

    .confirm input:checked {
      border-color: var(--hot);
      background: linear-gradient(135deg,var(--pink),var(--deep));
    }

    .confirm input:checked::after {
      content: "✓";
      position: absolute;
      inset: -1px 0 0;
      color: white;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .confirm strong {
      display: block;
      margin-bottom: 5px;
      font-size: 16px;
    }

    .confirm small {
      display: block;
      color: #9b8791;
      font-size: 13px;
      line-height: 1.4;
    }

    .continue {
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: linear-gradient(100deg,#ff3299 0%,#f00070 52%,#bd004e 100%);
      box-shadow: 0 10px 22px rgba(220,25,96,.23);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s, opacity .18s;
    }

    .continue:disabled {
      opacity: .48;
      cursor: not-allowed;
      box-shadow: none;
    }

    .continue:not(:disabled):active {
      transform: translateY(1px) scale(.99);
    }

    .foot {
      margin: 25px 0 0;
      padding-top: 18px;
      border-top: 1px solid #f5e5ed;
      color: #aa98a1;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 380px) {
      .card { padding: 29px 20px 25px; }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="shield" aria-hidden="true">🛡️</div>

    <h1>Verificação de acesso</h1>

    <p class="intro">
      Confirme que deseja continuar para acessar o conteúdo.
    </p>

    <label class="confirm" for="confirmar">
      <input id="confirmar" type="checkbox">
      <span>
        <strong>Confirmar e continuar</strong>
        <small>Toque no quadradinho para prosseguir</small>
      </span>
    </label>

    <button class="continue" id="continuar" type="button" disabled>
      🔥 Liberar acesso
    </button>

    <p class="foot">
      Confirmação de acesso · Continue quando estiver pronto
    </p>

    <p id="feedback" role="status" aria-live="polite" hidden
       style="margin:18px 0 0;color:#d00060;font-size:14px;font-weight:700;line-height:1.5;">
      🔥 Acesso confirmado! Preparando seu conteúdo exclusivo...
    </p>

  </main>

  <script>
    const checkbox = document.getElementById('confirmar');
    const button = document.getElementById('continuar');

    const destination = 'https://www.crownbot.com.br/rafaela';

    checkbox.addEventListener('change', () => {
      button.disabled = !checkbox.checked;
    });

    button.addEventListener('click', () => {
      if (checkbox.checked) {
        button.disabled = true;
        button.textContent = '🔥 Liberando acesso...';

        document.getElementById('feedback').hidden = false;

        window.setTimeout(() => {
          window.location.href = destination;
        }, 850);
      }
    });
  </script>

</body>
</html>
